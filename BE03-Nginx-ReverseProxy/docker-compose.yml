services:
  postgres:
    image: postgres:16-alpine
    container_name: store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: store_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_backend_main
    restart: unless-stopped
    environment:
      PORT: "8080"
      SERVER_PORT: "8080"
      INSTANCE_NAME: "backend-main-8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: store_db
      READ_ONLY: "false"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_backend_ro_1
    restart: unless-stopped
    environment:
      PORT: "8080"
      SERVER_PORT: "8080"
      INSTANCE_NAME: "backend-replica1-8082"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: store_readonly
      DB_PASSWORD: readonly_pass
      DB_NAME: store_db
      READ_ONLY: "true"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_backend_ro_2
    restart: unless-stopped
    environment:
      PORT: "8080"
      SERVER_PORT: "8080"
      INSTANCE_NAME: "backend-replica2-8083"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: store_readonly
      DB_PASSWORD: readonly_pass
      DB_NAME: store_db
      READ_ONLY: "true"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: store_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@store.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: store_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend1
      - backend2
      - backend3
      - pgadmin

volumes:
  pgdata:
