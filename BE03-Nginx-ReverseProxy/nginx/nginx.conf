user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream: $upstream_addr cache: $upstream_cache_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ---------------------------------------------------------
    # 4. Caching Configuration
    # Caches all GET requests except /api
    # ---------------------------------------------------------
    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=app_cache:10m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    # Determine cache bypass: bypass if URI begins with /api or if method is not GET/HEAD
    map "$request_method:$request_uri" $skip_cache {
        ~^GET:/api      1;
        ~^HEAD:/api     1;
        ~^GET:          0;
        ~^HEAD:         0;
        default         1;
    }

    # ---------------------------------------------------------
    # 5. Gzip Compression Configuration
    # Compression disabled for media types (jpeg, png, etc.)
    # ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ---------------------------------------------------------
    # 3. Upstream Load Balancing
    # Balancing 3 backends in ratio 2:1:1 for GET requests
    # Main backend (backend1) handles all write requests
    # ---------------------------------------------------------
    upstream backend_get_balanced {
        server backend1:8080 weight=2 max_fails=3 fail_timeout=10s;
        server backend2:8080 weight=1 max_fails=3 fail_timeout=10s;
        server backend3:8080 weight=1 max_fails=3 fail_timeout=10s;
    }

    upstream backend_main {
        server backend1:8080 max_fails=3 fail_timeout=10s;
    }

    upstream pgadmin_upstream {
        server pgadmin:80;
    }

    # Map request method to backend pool:
    # GET and HEAD are load-balanced across 3 backends (2:1:1)
    # POST, PUT, PATCH, DELETE go exclusively to backend_main (primary read-write)
    map $request_method $backend_pool {
        GET     backend_get_balanced;
        HEAD    backend_get_balanced;
        default backend_main;
    }

    # ---------------------------------------------------------
    # HTTP Server (Port 80) -> Redirect to HTTPS
    # ---------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name appliance-store.local store.local localhost;

        # Status endpoint accessible via HTTP as well
        location /status {
            stub_status on;
            access_log off;
        }

        # Redirect all other HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------
    # 6. HTTPS Server (Port 443 with TLS/SSL & HTTP/2)
    # ---------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name appliance-store.local store.local localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL Protocols & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Caching settings
        proxy_cache app_cache;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -----------------------------------------------------
        # 2. Routing Configuration
        # -----------------------------------------------------

        # 2.3 Static distribution on / (index.html & image.png)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=3600";
        }

        # 2.2 On /api/v1 path, output Swagger
        location = /api/v1 {
            rewrite ^ /swagger/index.html break;
            proxy_pass http://backend_main;
        }

        location = /api/v1/ {
            rewrite ^ /swagger/index.html break;
            proxy_pass http://backend_main;
        }

        # Swagger assets (bundle.js, swagger-ui.css, doc.json, etc.)
        location /swagger/ {
            proxy_pass http://backend_main;
        }

        # Handle Swagger assets referenced under /api/v1/
        location ~ ^/api/v1/(swagger-ui.*|doc\.json|favicon.*) {
            rewrite ^/api/v1/(.*)$ /swagger/$1 break;
            proxy_pass http://backend_main;
        }

        # 2.1 Route /api -> /api/v1
        location = /api {
            rewrite ^ /swagger/index.html break;
            proxy_pass http://backend_main;
        }

        location = /api/ {
            rewrite ^ /swagger/index.html break;
            proxy_pass http://backend_main;
        }

        # Route /api/xxx -> /api/v1/xxx with load balancing
        location /api/ {
            rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 break;
            proxy_pass http://$backend_pool;
        }

        # Load-balanced API endpoints under /api/v1/
        location /api/v1/ {
            proxy_pass http://$backend_pool;
        }

        # Support optional /api/v2 path mentioned in README
        location /api/v2/ {
            rewrite ^/api/v2/(.*)$ /api/v1/$1 break;
            proxy_pass http://$backend_pool;
        }

        # 2.4 /admin pgAdmin GUI DBMS POSTGRES
        location /admin/ {
            proxy_pass http://pgadmin_upstream/;
            proxy_set_header X-Script-Name /admin;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location = /admin {
            return 301 /admin/;
        }

        # 2.5 /status Nginx server status page (stub_status)
        location /status {
            stub_status on;
            access_log off;
        }
    }
}
