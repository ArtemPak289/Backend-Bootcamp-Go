events {
    worker_connections 1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr cache: $upstream_cache_status';

    access_log /tmp/nginx_access.log main;
    error_log  /tmp/nginx_error.log notice;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Caching
    proxy_cache_path /tmp/nginx_cache
                     levels=1:2
                     keys_zone=app_cache:10m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    map "$request_method:$request_uri" $skip_cache {
        ~^GET:/api      1;
        ~^HEAD:/api     1;
        ~^GET:          0;
        ~^HEAD:         0;
        default         1;
    }

    # Gzip Compression (excluding media)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Upstreams: 2:1:1 balancing for GET, main backend for mutations
    upstream backend_get_balanced {
        server 127.0.0.1:8081 weight=2 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8082 weight=1 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8083 weight=1 max_fails=3 fail_timeout=10s;
    }

    upstream backend_main {
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    }

    upstream pgadmin_upstream {
        server 127.0.0.1:5050;
    }

    map $request_method $backend_pool {
        GET     backend_get_balanced;
        HEAD    backend_get_balanced;
        default backend_main;
    }

    # HTTP Server
    server {
        listen 8080;
        server_name appliance-store.local store.local localhost;

        location /status {
            stub_status on;
            access_log off;
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 8443 ssl;
        http2 on;
        server_name appliance-store.local store.local localhost;

        ssl_certificate     "/Users/artempak/Desktop/School 21/BE3_Nginx_Pro_ID_1269323-1/src/ssl/server.crt";
        ssl_certificate_key "/Users/artempak/Desktop/School 21/BE3_Nginx_Pro_ID_1269323-1/src/ssl/server.key";

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        proxy_cache app_cache;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Static distribution on /
        location / {
            root "/Users/artempak/Desktop/School 21/BE3_Nginx_Pro_ID_1269323-1/src/static";
            index index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=3600";
        }

        # /api/v1 Swagger
        location = /api/v1 {
            rewrite ^ /swagger/index.html break;
            proxy_pass http://backend_main;
        }

        location = /api/v1/ {
            rewrite ^ /swagger/index.html break;
            proxy_pass http://backend_main;
        }

        location /swagger/ {
            proxy_pass http://backend_main;
        }

        location ~ ^/api/v1/(swagger-ui.*|doc\.json|favicon.*) {
            rewrite ^/api/v1/(.*)$ /swagger/$1 break;
            proxy_pass http://backend_main;
        }

        # Route /api -> /api/v1
        location = /api {
            rewrite ^ /swagger/index.html break;
            proxy_pass http://backend_main;
        }

        location = /api/ {
            rewrite ^ /swagger/index.html break;
            proxy_pass http://backend_main;
        }

        # Route /api/xxx -> /api/v1/xxx with load balancing
        location /api/ {
            rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 break;
            proxy_pass http://$backend_pool;
        }

        location /api/v1/ {
            proxy_pass http://$backend_pool;
        }

        location /api/v2/ {
            rewrite ^/api/v2/(.*)$ /api/v1/$1 break;
            proxy_pass http://$backend_pool;
        }

        # pgAdmin
        location /admin/ {
            proxy_pass http://pgadmin_upstream/;
            proxy_set_header X-Script-Name /admin;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location = /admin {
            return 301 /admin/;
        }

        # Status
        location /status {
            stub_status on;
            access_log off;
        }
    }
}
