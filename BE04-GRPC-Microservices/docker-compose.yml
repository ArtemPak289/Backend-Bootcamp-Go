services:
  postgres:
    image: postgres:16-alpine
    container_name: be4_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: be4_auth_service
    restart: unless-stopped
    environment:
      GRPC_PORT: "50051"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth_db
      DB_SSLMODE: disable
      JWT_SECRET: school21-secret-jwt-token-key-2026
      TOKEN_EXPIRY_HOURS: "24"
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  store_service:
    build:
      context: ./store_service
      dockerfile: Dockerfile
    container_name: be4_store_service
    restart: unless-stopped
    environment:
      PORT: "8080"
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: store_db
      DB_SSLMODE: disable
      AUTH_SERVICE_ADDR: auth_service:50051
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started

volumes:
  pgdata:
